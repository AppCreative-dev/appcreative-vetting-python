receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  # A copy for the automatic checker.
  file:
    path: /telemetry-output/telemetry.jsonl
  # Everything goes on to Grafana.
  otlp:
    endpoint: lgtm:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file, otlp]
    metrics:
      receivers: [otlp]
      exporters: [file, otlp]
    logs:
      receivers: [otlp]
      exporters: [file, otlp]
